name: Storefront deploy (Cloudflare Workers)

# Publishes the storefront as a Cloudflare Worker with static assets.
# Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.
# Skips gracefully if the token is not set.

on:
  push:
    branches: [main]
    paths:
      - 'storefront/**'
      - 'wrangler.toml'
      - '.github/workflows/storefront-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild catalogue from source of truth
        run: |
          cd storefront
          npm run generate

      - name: Deploy Worker
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Report skip (no Cloudflare token)
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN not set - skipping deploy."
